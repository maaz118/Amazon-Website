<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

</head>

<body>

    <header>

        <div class="navbar">

            <div class="navlogo">
                <div class="logo"></div>
            </div>

            <h2 style="color:white;">Shopping Cart</h2>

            <div class="nav-theme" id="themeToggle" title="Toggle dark / light theme"
                style="cursor:pointer;color:white;margin-right:20px;">
                <i class="fa-solid fa-moon"></i>
            </div>

            <div class="nav-cart">

                <a href="index.html" style="color:white;text-decoration:none;">

                    <i class="fa-solid fa-house"></i>

                    Home

                </a>

            </div>

        </div>

    </header>

    <section class="cart-page">

        <h1>Your Shopping Cart</h1>

        <div id="cartItems"></div>

        <h2 id="totalPrice"></h2>

        <button onclick="checkout()">

            Proceed To Checkout

        </button>

    </section>

    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const cartItems = document.getElementById("cartItems");

        const totalPrice = document.getElementById("totalPrice");

        let total = 0;

        function loadCart() {

            cartItems.innerHTML = "";

            total = 0;

            if (cart.length === 0) {

                cartItems.innerHTML = "<h2>Your cart is empty.</h2>";

                totalPrice.innerHTML = "";

                return;

            }

            cart.forEach((item, index) => {

                const qty = item.qty || 1;

                total += item.price * qty;

                cartItems.innerHTML += `

        <div class="cart-card">

            <img src="${item.image}">

            <div>

                <h2>${item.name}</h2>

                <p>${item.vendor}</p>

                <h3>$${item.price} x ${qty} = $${(item.price * qty).toFixed(2)}</h3>

                <div class="qty-controls">

                    <button onclick="changeQty(${index}, -1)">-</button>

                    <span>${qty}</span>

                    <button onclick="changeQty(${index}, 1)">+</button>

                </div>

                <button class="remove-btn" onclick="removeCart(${index})">

                    Remove

                </button>

            </div>

        </div>

        `;

            });

            totalPrice.innerHTML = "Total : $" + total.toFixed(2);

        }

        function changeQty(index, delta) {

            cart[index].qty = (cart[index].qty || 1) + delta;

            if (cart[index].qty < 1) {
                cart.splice(index, 1);
            }

            localStorage.setItem("cart", JSON.stringify(cart));

            loadCart();

        }

        function removeCart(index) {

            cart.splice(index, 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            loadCart();

        }

        function checkout() {

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            alert("Thank you for shopping!");

            localStorage.removeItem("cart");

            location.reload();

        }

        loadCart();

    </script>

</body>

</html>
